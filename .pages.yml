media:
  input: media
  output: /haze-notes/media
  rename: safe

content:
  - name: posts
    label: Journal entries
    type: collection
    path: content/posts
    format: json
    filename: "{primary}.json"
    exclude: [README.md]
    view:
      primary: title
      fields: [title, category, date, published]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: category
        label: Category
        type: select
        options:
          values: [Reviews, Culture, Gear, Field Notes]
        required: true
      - name: label
        label: Subtitle or verdict
        type: string
      - name: date
        label: Publication date
        type: date
        options:
          format: yyyy-MM-dd
      - name: published
        label: Make public on HAZE.
        type: boolean
        default: false
        description: Keep this off while drafting. Switch it on when ready for public testing.
      - name: image
        label: Cover photograph
        type: image
      - name: body
        label: Article
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
