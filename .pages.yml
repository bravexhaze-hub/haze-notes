media:
  input: media
  output: /haze-notes/media
  rename: safe
content:
  - name: posts
    label: Journal entries
    type: collection
    path: content/posts
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      fields: [title, category, date, published]
      sort: date
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: category
        label: Category
        type: select
        options:
          values: [Reviews, Culture, Gear, Field Notes]
        required: true
      - name: label
        label: Subtitle or byline
        type: string
      - name: date
        label: Publication date
        type: date
      - name: published
        label: Published
        type: boolean
        default: true
      - name: image
        label: Cover photograph
        type: image
      - name: body
        label: Article text
        type: text
        required: true
